{{define "auth/register.html"}}
{{template "header" .}}
{{template "navbar" .}}

<main class="main-content">
  <div class="auth-container">
    <div class="card">
      <div style="text-align: center; margin-bottom: 1.5rem;">
        <h1 style="font-size: 1.8rem; margin-bottom: 0.5rem;">Crear Cuenta</h1>
        <p style="color: var(--text-secondary); font-size: 0.9rem;">Únete a la comunidad de AutoMarket</p>
      </div>

      {{template "flash" .}}

      <form action="/register" method="POST">
        <div class="form-group">
          <label class="form-label" for="username">Nombre de Usuario</label>
          <input type="text" id="username" name="username" class="form-control" placeholder="juan_perez" required autofocus>
        </div>

        <div class="form-group">
          <label class="form-label" for="email">Correo Electrónico</label>
          <input type="email" id="email" name="email" class="form-control" placeholder="juan@ejemplo.com" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="role">Tipo de Cuenta (Rol AAA)</label>
          <select id="role" name="role" class="form-control" style="cursor: pointer;">
            <option value="BUYER" selected>Comprador (Consultar y reservar vehículos)</option>
            <option value="SELLER">Vendedor (Publicar y administrar vehículos propios)</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Contraseña (Mínimo 6 caracteres)</label>
          <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" minlength="6" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="confirm_password">Confirmar Contraseña</label>
          <input type="password" id="confirm_password" name="confirm_password" class="form-control" placeholder="••••••••" minlength="6" required>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">Registrarse</button>
      </form>

      <p style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-secondary);">
        ¿Ya tienes cuenta? <a href="/login">Inicia sesión</a>
      </p>
    </div>
  </div>
</main>

{{template "footer" .}}
{{end}}
