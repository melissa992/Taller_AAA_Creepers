{{define "auth/login.html"}}
{{template "header" .}}
{{template "navbar" .}}

<main class="main-content">
  <div class="auth-container">
    <div class="card">
      <div style="text-align: center; margin-bottom: 1.5rem;">
        <h1 style="font-size: 1.8rem; margin-bottom: 0.5rem;">Iniciar Sesión</h1>
        <p style="color: var(--text-secondary); font-size: 0.9rem;">Acceda al sistema seguro AutoMarket</p>
      </div>

      {{template "flash" .}}

      <form action="/login" method="POST" id="loginForm">
        <input type="hidden" name="redirect" value="{{.Redirect}}">
        
        <div class="form-group">
          <label class="form-label" for="username">Usuario</label>
          <input type="text" id="username" name="username" class="form-control" placeholder="Ingrese su usuario" required autofocus>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Contraseña</label>
          <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">Ingresar al Sistema</button>
      </form>

      <div class="demo-accounts">
        <p style="font-size: 0.8rem; color: var(--text-muted); text-align: center; margin-bottom: 0.5rem;">
          Cuentas demo para evaluación de roles AAA:
        </p>
        <div class="demo-buttons">
          <button type="button" class="btn btn-secondary btn-sm" onclick="fillCredentials('admin', 'Admin123!')">
            Admin
          </button>
          <button type="button" class="btn btn-secondary btn-sm" onclick="fillCredentials('vendedor1', 'Vendedor123!')">
            Vendedor
          </button>
          <button type="button" class="btn btn-secondary btn-sm" onclick="fillCredentials('comprador1', 'Comprador123!')">
            Comprador
          </button>
        </div>
      </div>

      <p style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-secondary);">
        ¿No tienes cuenta? <a href="/register">Crear cuenta</a>
      </p>
    </div>
  </div>
</main>

<script>
function fillCredentials(user, pass) {
  document.getElementById('username').value = user;
  document.getElementById('password').value = pass;
}
</script>

{{template "footer" .}}
{{end}}
