{{define "errors/500.html"}}
{{template "header" .}}
{{template "navbar" .}}

<main class="main-content">
  <div style="max-width: 500px; margin: 4rem auto; text-align: center;">
    <div class="card" style="padding: 3rem 2rem;">
      <h1 style="font-size: 3.5rem; color: var(--brand-rose); font-family: 'Outfit'; margin-bottom: 0.5rem;">500</h1>
      <h2 style="font-size: 1.5rem; margin-bottom: 0.75rem;">Error Interno del Servidor</h2>
      <p style="color: var(--text-secondary); margin-bottom: 2rem; font-size: 0.95rem;">
        {{if .Error}}{{.Error}}{{else}}Ocurrió una condición inesperada al procesar su solicitud.{{end}}
      </p>
      <a href="/vehicles" class="btn btn-primary">Volver al inicio</a>
    </div>
  </div>
</main>

{{template "footer" .}}
{{end}}
