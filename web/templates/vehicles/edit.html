{{define "vehicles/edit.html"}}
{{template "header" .}}
{{template "navbar" .}}

<main class="main-content">
  <div style="max-width: 720px; margin: 0 auto;">
    <div style="margin-bottom: 1.5rem;">
      <a href="/vehicles/{{.Vehicle.ID}}" style="display: inline-flex; align-items: center; gap: 0.4rem; color: var(--text-secondary); font-size: 0.9rem;">
        &larr; Volver al detalle del vehículo
      </a>
    </div>

    <div class="card">
      <div style="margin-bottom: 1.5rem;">
        <h1 style="font-size: 1.8rem; margin-bottom: 0.3rem;">Editar Vehículo</h1>
        <p style="color: var(--text-secondary); font-size: 0.9rem;">Modifique los atributos de la publicación #{{.Vehicle.ID}}</p>
      </div>

      {{template "flash" .}}

      <form action="/vehicles/{{.Vehicle.ID}}/edit" method="POST">
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
          <div class="form-group">
            <label class="form-label" for="brand">Marca *</label>
            <input type="text" id="brand" name="brand" value="{{.Vehicle.Brand}}" class="form-control" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="model">Modelo *</label>
            <input type="text" id="model" name="model" value="{{.Vehicle.Model}}" class="form-control" required>
          </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1rem;">
          <div class="form-group">
            <label class="form-label" for="year">Año *</label>
            <input type="number" id="year" name="year" value="{{.Vehicle.Year}}" class="form-control" min="1900" max="2027" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="price">Precio (USD) *</label>
            <input type="number" step="0.01" id="price" name="price" value="{{.Vehicle.Price}}" class="form-control" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="mileage">Kilometraje (km)</label>
            <input type="number" id="mileage" name="mileage" value="{{.Vehicle.Mileage}}" class="form-control">
          </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
          <div class="form-group">
            <label class="form-label" for="status">Estado Comercial</label>
            <select id="status" name="status" class="form-control" style="cursor: pointer;">
              <option value="AVAILABLE" {{if eq .Vehicle.Status "AVAILABLE"}}selected{{end}}>Disponible</option>
              <option value="RESERVED" {{if eq .Vehicle.Status "RESERVED"}}selected{{end}}>Reservado</option>
              <option value="SOLD" {{if eq .Vehicle.Status "SOLD"}}selected{{end}}>Vendido</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label" for="image_url">URL de Imagen</label>
            <input type="url" id="image_url" name="image_url" value="{{.Vehicle.ImageURL}}" class="form-control">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="description">Descripción</label>
          <textarea id="description" name="description" rows="4" class="form-control">{{.Vehicle.Description}}</textarea>
        </div>

        <div style="display: flex; gap: 1rem; justify-content: flex-end; margin-top: 1rem;">
          <a href="/vehicles/{{.Vehicle.ID}}" class="btn btn-secondary">Cancelar</a>
          <button type="submit" class="btn btn-primary">Guardar Cambios</button>
        </div>
      </form>
    </div>
  </div>
</main>

{{template "footer" .}}
{{end}}
